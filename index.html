<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CRAFT FLOW — Gestión de Productos Creativos</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

    <div class="app">

        <header class="header">

            <h1>CRAFT FLOW</h1>

            <span>Gestión de Productos Creativos</span>

                <div class="empresa-selector">
                
                    <div class="empresa-info">
                
                        <img
                            id="empresa-logo"
                            src=""
                            alt=""
                            class="empresa-logo"
                        >
                
                        <div class="empresa-texto">
                
                            <span class="empresa-label">
                                EMPRESA
                            </span>
                
                            <select
                                id="empresa-select"
                                aria-label="Seleccionar empresa"
                            >
                            </select>
                
                        </div>
                
                    </div>
                
                </div>            
        </header>


        <main class="main">

            <section>

                <h2>Modelos</h2>

                <div id="modelos-container">

                    <p>Cargando modelos...</p>

                </div>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
